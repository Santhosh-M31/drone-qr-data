<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Product Delivery 04</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 20px;
    }
    .msg {
      font-size: 18px;
      font-weight: 600;
      margin: 12px 0 8px;
    }
    .fname {
      font-size: 20px;
      font-weight: 700;
      color: #0f62fe;
      margin-bottom: 22px;
      letter-spacing: 0.2px;
    }
    .redirect {
      font-size: 15px;
      color: #4b5563;
      margin-top: 12px;
    }
    .count {
      display: inline-block;
      min-width: 28px;
      font-weight: 700;
      color: #0f62fe;
      font-size: 20px;
    }
    .manual {
      display: block;
      margin-top: 18px;
      font-size: 13px;
      color: #6b7280;
      text-decoration: none;
    }
    .manual a { color: #0f62fe; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://santhosh-m31.github.io/drone-qr-data/logo.jpg" alt="Tec Solution Group">
    <div class="msg">You have downloaded</div>
    <div class="fname">Product Delivery 04</div>
    <div class="redirect">
      Redirecting to company website in <span class="count" id="count">5</span>
    </div>
    <div class="manual">
      Not redirecting? <a id="manualLink" href="https://www.tecsolutiongroup.com/">Click here</a>
    </div>
  </div>

  <script>
    (async function() {
      const rawUrl = 'https://raw.githubusercontent.com/Santhosh-M31/drone-qr-data/master/Product_Delivery_04.csv';
      const redirectUrl = 'https://www.tecsolutiongroup.com/';
      const d = new Date();
      const ts = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0');
      const filename = 'Product_Delivery_04_' + ts + '.csv';

      try {
        const res = await fetch(rawUrl);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
      } catch (e) {
        const a = document.createElement('a');
        a.href = rawUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      let n = 5;
      const countEl = document.getElementById('count');
      const timer = setInterval(() => {
        n -= 1;
        if (n <= 0) {
          clearInterval(timer);
          window.location.href = redirectUrl;
        } else {
          countEl.textContent = n;
        }
      }, 1000);
    })();
  </script>
</body>
</html>
